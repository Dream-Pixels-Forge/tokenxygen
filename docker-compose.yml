services:
  tokenxygen:
    build: .
    container_name: tokenxygen
    restart: unless-stopped
    ports:
      - "8420:8420"   # Proxy
      - "8421:8421"   # Dashboard
      - "9090:9090"   # Metrics
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOKENDATA_DIR=/data
      - TOKENSAVER_LOG_LEVEL=INFO
      - TOKENSAVER_JSON_LOGS=true
    volumes:
      - tokenxygen-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: tokenxygen-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

volumes:
  tokenxygen-data:
  prometheus-data:
